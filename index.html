<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<title>CompareIt</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: barra superior fija con modo y estado de sincronización · columna de grupos + área de trabajo; en celular la columna pasa a fila de chips */
:root{
  --bg:#F1F2F7; --surface:#FFFFFF; --sunk:#E8EAF2; --ink:#1A1E31; --muted:#5B6181; --line:#D8DBE7;
  --accent:#3A48C6; --accent-ink:#FFFFFF; --adv:#1B8455; --dis:#BE3B28; --eq:#626D8E; --warn:#A5680F;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11131D; --surface:#191C2A; --sunk:#222638; --ink:#E6E8F2; --muted:#9BA1BE; --line:#2D3147;
  --accent:#8E99FF; --accent-ink:#11131D; --adv:#4CC48B; --dis:#F17C66; --eq:#9AA1BD; --warn:#E3A94B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11131D; --surface:#191C2A; --sunk:#222638; --ink:#E6E8F2; --muted:#9BA1BE; --line:#2D3147;
  --accent:#8E99FF; --accent-ink:#11131D; --adv:#4CC48B; --dis:#F17C66; --eq:#9AA1BD; --warn:#E3A94B; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
img{max-width:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--surface)}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:1.9rem;font-weight:700}
h2{font-size:1.3rem;font-weight:700}
h3{font-size:1rem;font-weight:700}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted)}
.eyebrow{font-size:.72rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.val{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:.9rem}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1400px;margin:0 auto;display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{font-family:var(--f-display);font-weight:700;font-size:1.35rem;display:flex;align-items:center;gap:8px;margin-right:auto}
.brand svg{width:26px;height:26px}
.seg{display:inline-flex;background:var(--sunk);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:999px;font-size:.84rem;font-weight:500;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / .15)}
.chip-sync{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:.84rem;font-weight:500;cursor:pointer}
.dot{width:9px;height:9px;border-radius:50%;background:var(--adv);flex:none}
.st-pend .dot{background:var(--warn)} .st-conf .dot{background:var(--dis)} .st-off .dot{background:var(--eq)}
.st-busy .dot{background:var(--accent);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}
@media (prefers-reduced-motion:reduce){.st-busy .dot{animation:none}}

.shell{max-width:1400px;margin:0 auto;display:grid;grid-template-columns:var(--side-w,240px) minmax(0,1fr);gap:28px;padding-block:22px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.side{display:flex;flex-direction:column;gap:8px;min-width:0;position:relative}
.side-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:6px}
.glist{display:flex;flex-direction:column;gap:4px}
.gitem{display:flex;flex-direction:column;align-items:flex-start;gap:1px;text-align:left;border:1px solid transparent;background:transparent;border-radius:var(--r);padding:9px 12px;cursor:pointer;width:100%}
.gitem:hover{background:var(--sunk)}
.gitem.on{background:var(--surface);border-color:var(--line)}
.gname{font-weight:600}
.gmeta{font-size:.78rem;color:var(--muted)}
.sheetbtn .gname::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:7px;background:var(--adv);vertical-align:0}
main{min-width:0;display:flex;flex-direction:column;gap:18px}

.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 13px;font-size:.88rem;font-weight:500;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{background:var(--dis);border-color:var(--dis);color:#fff}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 10px;font-size:.82rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
body.ro .ed{display:none!important}

.banner{display:flex;gap:10px;align-items:flex-start;border:1px solid color-mix(in srgb,var(--warn) 45%,var(--line));background:color-mix(in srgb,var(--warn) 9%,var(--surface));border-radius:var(--r);padding:12px 14px;font-size:.9rem}
.gh{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.gh-t{display:flex;flex-direction:column;gap:4px;min-width:0}
.lead{color:var(--muted);max-width:65ch}
.gh-a{display:flex;gap:8px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{border:0;background:transparent;padding:9px 14px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;cursor:pointer;white-space:nowrap}
.tab.on{color:var(--ink);border-bottom-color:var(--accent)}

.instbar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.instlist{display:flex;gap:6px;flex-wrap:wrap;min-width:0}
.ichip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:.86rem;font-weight:500;cursor:pointer}
.ichip span{font-family:var(--f-mono);font-size:.76rem;color:var(--muted);margin-left:4px}
.ichip.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.ichip.on span{color:var(--bg);opacity:.75}
.insthead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.insthead > div:first-child{display:flex;flex-direction:column;gap:3px;min-width:0}

.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:separate;border-spacing:0}
.cmp{width:100%;min-width:max-content}
.cmp th,.cmp td{padding:10px 14px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
.cmp tbody tr:last-child > *{border-bottom:0}
.cmp .sticky{position:sticky;left:0;z-index:1;background:var(--surface);min-width:170px;max-width:230px;border-right:1px solid var(--line);font-weight:400}
.cmp thead th{vertical-align:bottom;min-width:160px}
.cmp tr.par > *{background:var(--sunk)}
.cn{display:block;font-weight:600}
.cw{display:block;font-size:.75rem;color:var(--muted)}
.ith{display:flex;align-items:center;gap:8px;font-weight:600}
.rank{font-family:var(--f-mono);font-size:.72rem;font-weight:500;border-radius:5px;padding:1px 6px;background:var(--sunk);color:var(--muted)}
.rank.r1{background:var(--accent);color:var(--accent-ink)}
.tot{margin:6px 0 4px;display:flex;align-items:baseline;gap:3px}
.tot .val{font-size:1.5rem;font-weight:500}
.bar{height:6px;background:var(--sunk);border-radius:3px;overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.cmp tr.par .bar{background:var(--surface)}
.mini{display:flex;align-items:center;gap:8px}
.mini .bar{flex:1}
td.cell{cursor:pointer}
body.ro td.cell{cursor:default}
td.cell:hover{outline:1px solid var(--line);outline-offset:-4px;border-radius:6px}
.m-adv{background:color-mix(in srgb,var(--adv) 8%,var(--surface))}
.m-dis{background:color-mix(in srgb,var(--dis) 8%,var(--surface))}
.mk{display:inline-block;font-size:.68rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:999px;margin-left:8px;white-space:nowrap}
.m-adv .mk{color:var(--adv);background:color-mix(in srgb,var(--adv) 15%,transparent)}
.m-dis .mk{color:var(--dis);background:color-mix(in srgb,var(--dis) 15%,transparent)}
.m-eq .mk,.m-mid .mk{color:var(--eq);background:color-mix(in srgb,var(--eq) 15%,transparent)}

.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:3px;font-size:.9rem}
.card .pos{color:var(--adv);font-weight:600;font-size:.8rem}
.card .neg{color:var(--dis);font-weight:600;font-size:.8rem}
.concl{grid-column:1/-1}
.concl p{max-width:75ch}
textarea,input,select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
textarea{resize:vertical}

.empty{border:1px dashed var(--line);border-radius:var(--r);padding:28px 20px;display:flex;flex-direction:column;align-items:flex-start;gap:8px;background:var(--surface)}
.empty p{color:var(--muted);max-width:60ch}

.tbl{width:100%;min-width:max-content;font-size:.9rem}
.tbl th,.tbl td{padding:9px 12px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.tbl thead th{font-size:.74rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);background:var(--sunk)}
.tbl tbody tr:last-child td{border-bottom:0}
.acts{display:flex;gap:6px;justify-content:flex-end}

.crow{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.crow:last-child{border-bottom:0}
.crow.top-level{background:var(--sunk)}
.crow .cname{flex:1;min-width:160px;display:flex;flex-direction:column}
.badge{font-size:.72rem;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.crow.top-level .badge{background:var(--surface)}
.badge.agg{color:var(--accent)}

.overlay{position:fixed;inset:0;background:rgb(10 12 25 / .45);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.dialog{background:var(--surface);border-radius:14px;width:min(560px,100%);max-height:88vh;display:flex;flex-direction:column;box-shadow:0 20px 50px rgb(0 0 0 / .3)}
.dialog header,.dialog footer{padding:16px 20px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.dialog header{border-bottom:1px solid var(--line)}
.dialog footer{border-top:1px solid var(--line);justify-content:flex-end}
.dbody{padding:18px 20px;overflow:auto;display:flex;flex-direction:column;gap:14px}
.fld{display:flex;flex-direction:column;gap:5px;font-size:.88rem;font-weight:500}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.hint{font-size:.82rem;color:var(--muted)}
.checks{display:flex;flex-direction:column;gap:6px}
.checks label{display:flex;gap:8px;align-items:center;font-weight:400}
.checks input{width:auto}
.x{border:0;background:transparent;font-size:1.3rem;line-height:1;cursor:pointer;color:var(--muted);padding:4px 8px}

.drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,100%);background:var(--surface);z-index:45;border-left:1px solid var(--line);box-shadow:-10px 0 40px rgb(0 0 0 / .18);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.drawer header{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.dr-body{overflow:auto;padding:16px 20px 28px;display:flex;flex-direction:column;gap:20px}
.dr-sec{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.switch{display:flex;align-items:center;gap:10px;font-size:.9rem;cursor:pointer}
.switch input{width:auto}
.plist{display:flex;flex-direction:column;gap:6px;font-size:.88rem}
.plist div{display:flex;justify-content:space-between;gap:8px;padding:7px 10px;border-radius:8px;background:var(--sunk)}
.conf{border:1px solid color-mix(in srgb,var(--dis) 40%,var(--line));border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:10px}
.conf h3{font-size:.95rem}
.conf table{width:100%;font-size:.84rem}
.conf td,.conf th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.conf th{font-size:.7rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600}
.opt{display:flex;gap:6px;align-items:flex-start;cursor:pointer}
.opt input{width:auto;margin-top:3px}
.opt small{display:block;color:var(--muted);font-size:.72rem}
.log{font-size:.82rem;display:flex;flex-direction:column;gap:4px}
.log span{font-family:var(--f-mono);color:var(--muted);margin-right:6px}

.menu{position:fixed;z-index:60;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgb(0 0 0 / .2);padding:6px;display:flex;flex-direction:column;min-width:190px}
.menu button{border:0;background:transparent;text-align:left;padding:8px 10px;border-radius:6px;cursor:pointer;font-size:.88rem}
.menu button:hover{background:var(--sunk)}
.menu .mh{font-size:.72rem;color:var(--muted);padding:4px 10px 6px;text-transform:uppercase;letter-spacing:.05em}

.sheet{display:flex;flex-direction:column;gap:14px}
.gs{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.gs-bar{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.gs-title{display:flex;align-items:center;gap:8px;font-weight:600;margin-right:auto}
.gs-title i{width:18px;height:22px;border-radius:3px;background:var(--adv);display:inline-block}
.grid{font-family:var(--f-mono);font-size:.82rem;min-width:max-content}
.grid th,.grid td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:0;height:30px}
.grid .ch,.grid .rh{background:var(--sunk);color:var(--muted);font-weight:500;text-align:center;font-size:.74rem;padding:0 8px}
.grid .rh{width:40px}
.grid .hdr .ro-c{white-space:normal;min-width:90px;line-height:1.25}
.grid .hdr td{background:color-mix(in srgb,var(--adv) 10%,var(--surface));font-weight:500}
.grid input{border:0;border-radius:0;background:transparent;padding:5px 8px;font-family:var(--f-mono);font-size:.82rem;min-width:90px;width:100%}
.grid input:focus{outline:2px solid var(--adv);outline-offset:-2px}
.grid .ro-c{padding:5px 8px;color:var(--muted);white-space:nowrap}
.grid .wide input{min-width:200px}
.gs-tabs{display:flex;gap:2px;overflow-x:auto;background:var(--sunk);padding:4px 6px 0}
.gs-tabs button{border:0;background:transparent;padding:7px 14px;font-size:.82rem;border-radius:6px 6px 0 0;cursor:pointer;color:var(--muted);white-space:nowrap}
.gs-tabs button.on{background:var(--surface);color:var(--adv);font-weight:600}

.errbox,.srcwarn{border-radius:8px;padding:10px 12px;font-size:.86rem;display:flex;flex-direction:column;gap:4px}
.errbox{border:1px solid color-mix(in srgb,var(--dis) 45%,var(--line));background:color-mix(in srgb,var(--dis) 8%,var(--surface))}
.errbox code{font-family:var(--f-mono);font-size:.8rem;white-space:pre-wrap;word-break:break-word}
.srcwarn{border:1px solid color-mix(in srgb,var(--warn) 45%,var(--line));background:color-mix(in srgb,var(--warn) 9%,var(--surface))}
a.gitem{text-decoration:none;color:inherit}
.srcbadge{font-family:var(--f-body);font-size:.66rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.ggrid{min-width:max-content}
.ggrid .ch{text-align:left;padding:6px 8px;height:auto;line-height:1.25}
.ggrid .ch .cw{text-transform:none;letter-spacing:0;font-weight:400}
.ggrid select{border:0;border-radius:0;background:transparent;padding:5px 8px;font-family:var(--f-mono);font-size:.82rem;min-width:120px;width:100%}
.ggrid select:focus{outline:2px solid var(--accent);outline-offset:-2px}
.ggrid input:focus{outline-color:var(--accent)}
.ggrid td.nm{position:sticky;left:0;z-index:1;background:var(--surface)}
.ggrid td.nm input{font-weight:500;min-width:180px}
.ggrid .newrow td{background:var(--sunk)}
.ggrid .newrow td.nm{background:var(--sunk)}
.grid select{border:0;border-radius:0;background:transparent;padding:5px 8px;font-family:var(--f-mono);font-size:.82rem;min-width:130px;width:100%;color:var(--ink)}
.grid select:focus,.mcell:focus-visible{outline:2px solid var(--adv);outline-offset:-2px}
.grid select:disabled{opacity:1}
.grid td.num input{text-align:right}
.grid input[readonly]{cursor:default}
.mcell{border:0;background:transparent;text-align:left;padding:5px 8px;font-family:var(--f-mono);font-size:.82rem;cursor:pointer;min-width:220px;width:100%;color:var(--ink);white-space:nowrap}
.mcell:hover:not(:disabled){background:var(--sunk)}
.grid .newrow td,.grid .newrow th{background:color-mix(in srgb,var(--adv) 6%,var(--sunk))}
.crl{display:flex;align-items:flex-start;gap:8px;cursor:pointer}
.crl input{width:auto;margin:3px 0 0;flex:none;accent-color:var(--accent)}
.crl input:disabled{cursor:not-allowed}
.cmp tr.off > *{color:var(--muted)}
.cmp tr.off .cn{text-decoration:line-through;font-weight:500}
.cmp tr.off td .val{opacity:.55}
.swipe{display:none}
@media (max-width:860px){
  .top-in{flex-wrap:nowrap;gap:8px;padding-block:8px}
  .brand{font-size:1.1rem;gap:6px;min-width:0}
  .brand svg{width:22px;height:22px}
  .srcbadge{font-size:.6rem;padding:2px 6px}
  .seg button{padding:7px 10px;min-height:36px}
  .chip-sync{padding:8px 10px;min-height:36px;font-size:.8rem;flex:none}
  .tab{min-height:44px;padding:10px 12px}
  .btn{min-height:40px}
  .btn.sm{min-height:36px;padding:6px 11px}
  .ichip{min-height:36px}
  .gitem{min-height:40px}
  .gh h1{font-size:1.45rem}
  .lead{font-size:.9rem}
  .swipe{display:block;font-size:.8rem;color:var(--muted);margin:0 0 -8px}
  .cmp .sticky{min-width:118px;max-width:128px;padding:8px 8px}
  .cmp thead th{min-width:108px;max-width:140px;padding:8px}
  .cmp td{padding:8px}
  .cmp .cn{font-size:.86rem;line-height:1.25}
  .cmp .cw{font-size:.7rem}
  .ith{font-size:.86rem;align-items:flex-start;flex-direction:column;gap:4px}
  .tot .val{font-size:1.2rem}
  .cmp td.cell .val{font-size:.8rem;display:block}
  .cmp td.cell .mk{display:inline-block;margin:4px 0 0;font-size:.72rem;padding:1px 7px}
  .mkt{display:none}
  .crl input{width:18px;height:18px}
  .card{padding:12px 14px}
  .crow{gap:8px;padding:10px 12px}
  .crow .cname{min-width:0;flex-basis:100%}
  .crow .acts{justify-content:flex-start;flex-wrap:wrap}
  .overlay{align-items:flex-end;padding:0}
  .dialog{width:100%;max-height:92vh;border-radius:16px 16px 0 0}
  .dialog footer{padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))}
  .dialog footer .btn{flex:1;justify-content:center}
  .dbody input,.dbody select,.dbody textarea,#f_concl{font-size:16px}
  .drawer{width:100%;border-left:0}

/* ---------- acceso a datos ---------- */
const recs = (t, src = S.app) => Object.entries(src).filter(([, r]) => r.t === t).map(([id, r]) => ({...r, id}));

function withRoot(u, src){ const r = src[u.root] || {}, o = {...u}; ROOTF.forEach(f => { if (r[f] != null && r[f] !== '') o[f] = r[f]; else delete o[f] }); if (!o.name) o.name = '(criterio sin definir)'; return o }

  const cs = crits(g, src);

function fmt(c, raw){

}

/* ---------- motor de evaluación ---------- */
function evaluate(g, its, inst, excl = new Set()){
  const list = treeFor(g, inst && inst.set);
  const off = new Set(); list.forEach(c => { if (excl.has(c.id) || c.setOff || (c.p && off.has(c.p))) off.add(c.id) }); const W = Object.fromEntries(list.map(c => [c.id, +c.w || 1]));
  const res = {};
  list.filter(c => c.leaf).forEach(c => {
    const sc = {};
    its.forEach(it => {
      const raw = c.kind === 'auto' ? autoVal(c, it) : (it['v.' + c.id] ?? ''); let s = null;
      if (c.kind === 'qual'){ const o = scaleOf(c); const i = o.indexOf(raw); if (i >= 0) s = o.length > 1 ? i / (o.length - 1) : 1 }
      else { const n = parseFloat(String(raw).replace(',', '.')); if (!isNaN(n)) s = n }
      sc[it.id] = s;
    });
    if (c.kind !== 'qual'){
      const ns = Object.values(sc).filter(x => x != null);

    }

      if (ov){ manual = true; mark = ov; s = ov === 'adv' ? 1 : ov === 'dis' ? 0 : 0.5 }
      res[c.id][it.id] = {score:s, mark, manual, raw:c.kind === 'auto' ? autoVal(c, it) : (it['v.' + c.id] ?? '')};
    });
  });

  [...list].reverse().forEach(c => { if (c.leaf) return; res[c.id] = {}; its.forEach(it => res[c.id][it.id] = {score:avg(c.kids, it.id)}) });
  const roots = list.filter(c => c.depth === 0).map(c => c.id);
  const total = {}; its.forEach(it => total[it.id] = avg(roots, it.id));
  return {list, res, total, off};
}

/** Errores pasajeros (red, demora o bloqueo momentáneo de la planilla): se reintenta antes de mostrar el error. */
const transientErr = m => /Failed to fetch|NetworkError|Load failed|timeout|HTTP 5\d\d|HTTP 429|lock|bloqueo|too many|demasiad|temporar|internal|interno|try again|intent[áa] de nuevo/i.test(m);
async function withRetry(fn){
  for (let i = 1; ; i++){
    try{ const r = await fn(); if (S.retry){ S.retry = 0; renderStatus() } return r }
    catch(e){ const m = String((e && e.message) || e); if (i >= 3 || !transientErr(m)){ S.retry = 0; throw e }

/* ---------- sincronización con fusión a 3 vías ---------- */
function norm(r){ if (!r) return null; const o = {}; Object.keys(r).filter(k => k !== 'u').sort().forEach(k => { if (r[k] !== '' && r[k] != null) o[k] = String(r[k]) }); return o }
const same = (a, b) => JSON.stringify(norm(a)) === JSON.stringify(norm(b));
const fv = (r, f) => r && r[f] != null ? String(r[f]) : '';
function merge3(a, b, r){
  const out = {}, conf = [];
  const fields = [...new Set([a, b, r].flatMap(x => x ? Object.keys(x) : []))].filter(f => f !== 'u');
  fields.forEach(f => {
    const av = fv(a, f), bv = fv(b, f), rv = fv(r, f); let val;
    if (av === rv) val = av; else if (av === bv) val = rv; else if (rv === bv) val = av; else { conf.push({f, a:av, r:rv}); val = av }
    if (val !== '') out[f] = val;
  });
  return {out, conf};
}
function pendingKeys(){
  const ks = new Set([...Object.keys(S.app), ...Object.keys(S.base || {})]);
  return [...ks].filter(k => !same(S.app[k], S.base[k]));
}
let syncTimer = null;
function scheduleSync(){ clearTimeout(syncTimer); if (S.online && S.mode === 'app') syncTimer = setTimeout(() => sync(true).then(() => planPoll(true)), 700); else renderStatus() }

/* ---------- verificación automática adaptable ---------- */
const AUTO = {normal:{base:60, max:300, label:'Normal: cada 1 a 5 min'}, ahorro:{base:180, max:900, label:'Ahorro de datos: cada 3 a 15 min'}, manual:{label:'Solo manual'}};
let pollT = null, pollDelay = 0, nextAt = 0;
function saver(){ const c = navigator.connection; return !!(c && (c.saveData || /2g$/.test(c.effectiveType || ''))) }
function effAuto(){ return S.auto === 'normal' && saver() ? 'ahorro' : S.auto }
function planPoll(reset){
  clearTimeout(pollT); nextAt = 0;
  const a = effAuto();
  if (a === 'manual' || !S.online || document.hidden || (MODE !== 'sim' && navigator.onLine === false)){ if (S.drawer) renderDrawer(); return }
  const cfg = AUTO[a], base = S.mode === 'sheet' ? Math.round(cfg.base / 2) : cfg.base;
  pollDelay = reset || !pollDelay ? base : Math.min(pollDelay * 2, cfg.max);
  nextAt = Date.now() + pollDelay * 1000;
  pollT = setTimeout(async () => { const ch = await sync(true); planPoll(ch) }, pollDelay * 1000);
  if (S.drawer) renderDrawer();
}

async function sync(quiet, force){
  if (S.syncing) return false; S.syncing = true; renderStatus();
  let changed = false, stale = false;
  try{
    const vi = await adapter.ver(); S.reach = true; S.checks++; S.lastCheck = now();
    const prevVer = S.ver; S.verInfo = vi;
    const needPush = S.mode === 'app' && pendingKeys().some(k => !S.conflicts.some(c => c.k === k));
    if (!force && !needPush && prevVer && vi.v === prevVer){ S.err = ''; S.syncing = false; save(); renderStatus(); if (S.drawer) renderDrawer(); return false }
    changed = vi.v !== prevVer;
    const remote = await adapter.pull(); S.pulls++;
    const app = S.app, base = S.base || {};
    const keys = new Set([...Object.keys(app), ...Object.keys(base), ...Object.keys(remote)]);
    const up = {}, dels = [], nApp = {}, nBase = {}, conflicts = []; let pulled = 0, pushed = 0;
    if (S.mode === 'sheet'){
      keys.forEach(k => { if (!same(app[k], remote[k])) pulled++ });
      Object.assign(nApp, clone(remote)); Object.assign(nBase, clone(remote));
    } else for (const k of keys){
      const a = app[k], b = base[k], r = remote[k];
      if (!a && !r) continue;
      if (!a){
        if (!b){ nApp[k] = r; nBase[k] = r; pulled++ }
        else if (same(r, b)){ dels.push({id:k, t:b.t, g:b.g}); pushed++ }
        else { conflicts.push({k, kind:'delApp', a:null, r, b}); nBase[k] = b }
        continue;
      }
      if (!r){
        if (!b){ up[k] = a; nApp[k] = a; nBase[k] = a; pushed++ }
        else if (same(a, b)) pulled++;
        else { conflicts.push({k, kind:'delSheet', a, r:null, b}); nApp[k] = a; nBase[k] = b }
        continue;
      }
      if (same(a, r)){ nApp[k] = r; nBase[k] = r; continue }
      const {out, conf} = merge3(a, b, r);
      if (conf.length){ conflicts.push({k, kind:'edit', a, r, b, out, conf}); nApp[k] = a; if (b) nBase[k] = b; continue }
      out.u = now(); nApp[k] = out; nBase[k] = out;
      if (!same(out, r)){ up[k] = out; pushed++ }
      if (!same(out, a)) pulled++;
    }
    let newVer = vi.v;
    if (Object.keys(up).length || dels.length){
      const res = await adapter.push(up, dels, vi.v); changed = true;
      if (res && res.v){ stale = !!res.stale; newVer = stale ? res.v + '*' : res.v }   // con '*' la próxima verificación vuelve a descargar
    }
    S.ver = newVer;
    S.app = nApp; S.base = nBase; S.conflicts = conflicts; S.last = now();
    if (!quiet || pulled || pushed || conflicts.length)
      log(`Sincronizado: ${pushed} enviados a la Sheet, ${pulled} recibidos${conflicts.length ? ', ' + conflicts.length + ' en conflicto' : ''}.`);
    if (conflicts.length && !quiet) openSync();
  }catch(e){
    S.reach = false;
    const msg = errText(e);
    if (!quiet || msg !== S.err) log('Error al sincronizar: ' + msg + ' · Los cambios quedan en la copia local.');
    S.err = msg;
  }
  if (S.reach) S.err = '';
  S.syncing = false; fixUi(); save(); render();
  if (stale) setTimeout(() => sync(true), 800);
  return changed;
}

function suggest(c){ return (c.a?.u || '') >= (c.r?.u || '') ? 'a' : 'r' }
async function resolve(keys){
  if (!S.online && !REAL) return toast('Reconectá la Sheet para aplicar la resolución.');
  const up = {}, dels = [];
  keys.forEach(k => {
    const c = S.conflicts.find(x => x.k === k); if (!c) return;
    const ch = S.choice[k] || {};
    if (c.kind === 'edit'){
      const fin = {...c.out};
      c.conf.forEach(x => { const pick = ch[x.f] || suggest(c); const val = pick === 'a' ? x.a : x.r; if (val === '') delete fin[x.f]; else fin[x.f] = val });
      fin.u = now(); up[k] = fin; S.app[k] = fin; S.base[k] = fin;
    } else {
      const pick = ch._ || suggest(c);
      const keepApp = pick === 'a';
      if (c.kind === 'delApp'){
        if (keepApp){ dels.push({id:k, t:c.r.t, g:c.r.g}); delete S.app[k]; delete S.base[k] }
        else { S.app[k] = c.r; S.base[k] = c.r }
      } else {
        if (keepApp){ const fin = {...c.a, u:now()}; up[k] = fin; S.app[k] = fin; S.base[k] = fin }
        else { delete S.app[k]; delete S.base[k] }
      }
    }
    S.conflicts = S.conflicts.filter(x => x.k !== k); delete S.choice[k];
  });
  try{ const res = await adapter.push(up, dels, S.ver); if (res && res.v) S.ver = res.stale ? res.v + '*' : res.v; log(`Aprobaste ${keys.length} resolución(es) de conflicto; se aplicaron en la app y en la Sheet.`) }
  catch(e){ S.err = errText(e); log('No se pudo escribir en la Sheet (' + S.err + '); la resolución queda pendiente de envío.') }
  fixUi(); save(); render();
}

const anyRec = id => S.app[id] || S.base[id] || SIM.records[id] || {};
const nameOf = id => { const r = anyRec(id); return (r.t === 'crit' ? anyRec(r.root).name : r.name) || id };
function recLabel(r){ if (!r) return ''; const g = r.g ? ' · ' + nameOf(r.g) : ''; const n = r.t === 'crit' ? anyRec(r.root).name : r.t === 'adj' ? nameOf(r.set) + ' / ' + nameOf(r.use) : r.name; return `${TYPE[r.t] || 'Registro'}: ${n || '(sin nombre)'}${g}` }
function fieldLabel(f){
  const F = {name:'Nombre', desc:'Descripción', notes:'Notas', items:'Ítems', concl:'Conclusión', p:'Criterio padre', root:'Criterio', set:'Conjunto', use:'Criterio', on:'Incluido', alt:'Definición alternativa', kind:'Tipo', dir:'Sentido', unit:'Unidad', scale:'Escala', w:'Peso', ord:'Orden', g:'Grupo', t:'Tipo de registro'};

    return `<tr><th class="sticky" ${pad}><label class="crl">${chk}<span><span class="cn">${esc(c.name)}</span><span class="cw">${critHint(c)} · peso ${c.w || 1}</span></span></label></th>${its.map(it => { const r = ev.res[c.id][it.id];
      return `<td class="cell m-${r.mark}" data-act="cell" data-it="${it.id}" data-c="${c.id}"><span class="val">${esc(fmt(c, r.raw))}</span>${MK[r.mark] ? `<span class="mk">${MK[r.mark]}${r.manual ? ' ✎' : ''}</span>` : ''}</td>` }).join('')}</tr>`;

  const marks = (it, m) => leaves.filter(c => ev.res[c.id][it.id].mark === m).map(c => c.name);

    <div class="card"><h3>Diferencias clave</h3>${diffs.length ? `<ul>${diffs.map(d => `<li>${esc(d.c.name)}: mejor ${esc(best(d.c))}</li>`).join('')}</ul>` : '<p class="muted">Sin diferencias marcadas.</p>'}
      <h3>Similitudes</h3>${sims.length ? `<ul>${sims.map(c => `<li>${esc(c.name)}</li>`).join('')}</ul>` : '<p class="muted">No hay criterios donde coincidan todos.</p>'}</div>
    <div class="card concl"><h3>Conclusión sugerida</h3><p>${esc(autoConclusion(its, ev, leaves))}</p>
      <label class="fld" for="f_concl"><span>Tu conclusión</span>
      <textarea id="f_concl" rows="3" ${canEdit() ? '' : 'readonly'} placeholder="Escribí tu decisión o matices que el puntaje no captura">${esc(cur.concl || '')}</textarea></label></div>
  </div>`;

}
function autoConclusion(its, ev, leaves){

  const p = x => Math.round(ev.total[x.id] * 100); const [w, s] = r;
  let t = `${w.name} obtiene el mejor puntaje global (${p(w)}/100)`;
  t += p(w) - p(s) <= 5 ? `, prácticamente empatado con ${s.name} (${p(s)}); la elección depende de qué criterio pese más para vos.` : `, por delante de ${s.name} (${p(s)}).`;
  const wa = leaves.filter(c => ev.res[c.id][w.id].mark === 'adv').map(c => c.name);
  const wd = leaves.filter(c => ev.res[c.id][w.id].mark === 'dis').map(c => c.name);
  if (wa.length) t += ` Se destaca en ${wa.join(', ')}.`;

}

/* ---------- validación y alta desde la Planilla ---------- */
function nextOrd(D, g, p){ return Math.max(0, ...recs('crit', D).filter(c => c.g === g && (c.p || '') === (p || '')).map(c => +c.ord || 0)) + 1 }
function planCheck(t, D, id, rec, f, val, col){
  if (!col) return null;
  if (col.req && !val) return `«${col.h}» no puede quedar vacío.`;
  if (col.type === 'num' && val && isNaN(Number(val.replace(',', '.')))) return `«${col.h}» tiene que ser un número.`;
  if (t === 'group' && f === 'name' && groups(D).some(x => x.id !== id && (x.name || '').toLowerCase() === val.toLowerCase())) return 'Ya hay un grupo con ese nombre: serían la misma pestaña de la Sheet.';
  if (t === 'crit' && f === 'p' && val && (val === id || descendants(id, rec.g, D).includes(val))) return 'Un criterio no puede depender de sí mismo ni de sus subcriterios.';
  if (t === 'crit' && f === 'p' && val && D[val] && D[val].g !== rec.g) return 'El criterio padre tiene que ser del mismo grupo.';
  if (t === 'root' && f === 'name' && rootTaken(val, D, id)) return 'Ya existe un criterio con ese nombre en el catálogo.';
  if (t === 'set' && f === 'name' && setsOf(rec.g, D).some(x => x.id !== id && (x.name || '').toLowerCase() === val.toLowerCase())) return 'Ya hay un conjunto con ese nombre en ese grupo.';
  if (t === 'adj' && (f === 'use' || f === 'set')){ const s2 = f === 'set' ? val : rec.set, u2 = f === 'use' ? val : rec.use;
    if (s2 && u2 && recs('adj', D).some(a => a.id !== id && a.set === s2 && a.use === u2)) return 'Ese criterio ya tiene un ajuste en ese conjunto.' }
  if (t === 'crit' && (f === 'root' || f === 'g')){ const g2 = f === 'g' ? val : rec.g, r2 = f === 'root' ? val : rec.root;
    if (r2 && recs('crit', D).some(u => u.id !== id && u.g === g2 && u.root === r2)) return 'Ese criterio ya está en ese grupo.' }
  return null;
}
function planApply(t, D, id, rec, f, val){
  const extra = [], old = String(rec[f] ?? '');

  if (t === 'root' && f === 'kind'){
    if (val === 'qual' && levelsOf(rec).length < 2){ rec.scale = 'Alto, Medio, Bajo'; toast('Se cargó una escala de ejemplo: tocá la celda Escala para ajustarla.') }
    if (val !== 'qual' && !rec.dir) rec.dir = 'max';
  }
  if (t === 'crit' && f === 'p') rec.ord = String(nextOrd(D, rec.g, val));
  if (t === 'crit' && f === 'g' && old && old !== val){
    rec.p = ''; rec.ord = String(nextOrd(D, val, ''));
    descendants(id, old, D).forEach(k => extra.push([k, {...D[k], g:val}]));
  }
  if (t === 'inst' && f === 'g' && old && old !== val){
    delete rec.items; Object.keys(rec).filter(k => k.startsWith('o.')).forEach(k => delete rec[k]);
    toast('La instancia cambió de grupo: elegí de nuevo sus ítems.');

}
function planNew(t, key, D, f, val){
  const s = SCHEMA[t], rec = {t};

    const g = f === 'g' ? val : (D[S.ui.g] ? S.ui.g : (groups(D)[0] || {}).id);
    if (!g) return 'Primero creá un grupo en la pestaña _Grupos.'; rec.g = g;
  }
  if (f !== 'name' && s.cols.some(c => c.f === 'name')){ let n = s.newName, i = 2; if (t === 'group' || t === 'root') while (recs(t, D).some(x => (x.name || '').toLowerCase() === n.toLowerCase())) n = s.newName + ' ' + (i++); rec.name = n }
  if (t === 'root'){ rec.kind = 'num'; rec.dir = 'max' }
  if (t === 'adj'){ if (f !== 'set') return 'Elegí primero el conjunto en la columna «Conjunto».'; if (D[val]) rec.g = D[val].g }
  if (t === 'crit'){ if (f !== 'root') return 'Elegí primero el criterio en la columna «Criterio».'; rec.w = '1'; rec.ord = String(nextOrd(D, rec.g, '')) }
  return {id:uid(s.prefix), rec};
}
function planChange(el){
  const sk = el.dataset.sk, st = STORE[sk]; if (!st || (sk === 'app' && !canEdit())) return;
  const D = st.get(), t = el.dataset.t, key = el.dataset.key, id = el.dataset.id, f = el.dataset.f, val = el.value.trim();
  const col = planCols(t, key, D).find(c => c.f === f);

  const extra = planApply(t, D, rid, rec, f, val);
  st.write(rid, rec); extra.forEach(([k, r]) => st.write(k, r)); st.after();
  setTimeout(() => { const a = document.activeElement;
    if (id === 'new') S.focusNext = a && a.dataset && a.dataset.id === 'new' ? pcId(sk, rid, a.dataset.f) : pcId(sk, rid, f);
    render() }, 0);

/* ---------- borrado con arrastre (sirve para la app y para la Planilla) ---------- */
function delText(D, t, id){
  const r = D[id] || {}, nm = esc(r.name || id);
  if (t === 'group') return `Se borrará el grupo «${nm}» con sus ítems, criterios e instancias.`;
  if (t === 'crit'){ const n = descendants(id, r.g, D).length, cn = esc((D[r.root] || {}).name || id);
    return `Se quitará «${cn}» del grupo «${esc((D[r.g] || {}).name || '')}»${n ? ' junto con sus ' + n + ' subcriterios' : ''} y los valores cargados en ese grupo. El criterio sigue en el catálogo.` }
  if (t === 'root'){ const gs = groupsOfRoot(id, D).map(x => esc(D[x].name)); return `Se borrará «${nm}» del catálogo${gs.length ? ' y de los grupos donde se usa (' + gs.join(', ') + '), con sus valores cargados' : ''}.` }
  if (t === 'item') return `Se borrará el ítem «${nm}» y se quitará de sus instancias.`;
  if (t === 'inst') return `Se borrará la instancia «${nm}». Los ítems no se borran.`;
  if (t === 'set'){ const us = instsUsingSet(id, D).map(n => esc(n.name)); return `Se borrará el conjunto «${nm}» con sus ajustes.${us.length ? ' Las instancias que lo usan (' + us.join(', ') + ') vuelven a la Base.' : ''}` }
  if (t === 'adj') return 'Se borrará este ajuste: el criterio vuelve a seguir a la Base en ese conjunto.';
  return `Se borrará «${nm}».`;
}
function cascadeDel(sk, t, id){
  const st = STORE[sk], D = st.get(), r = D[id]; if (!r) return;
  if (t === 'group') Object.keys(D).filter(k => D[k].g === id).forEach(k => st.del(k));
  if (t === 'root') usesOf(id, D).forEach(u => { if (D[u.id]) cascadeDel(sk, 'crit', u.id) });
  if (t === 'set') adjsOf(id, D).forEach(a => st.del(a.id));
  if (t === 'crit'){
    const gone = [id, ...descendants(id, r.g, D)]; gone.forEach(k => st.del(k));
    recs('adj', D).filter(a => gone.includes(a.use)).forEach(a => st.del(a.id));
    Object.keys(D).filter(k => D[k].g === r.g).forEach(k => { const rec = {...D[k]}; let ch = false;
      Object.keys(rec).forEach(f => { if (gone.some(c => f === 'v.' + c || (f.startsWith('o.') && f.endsWith('.' + c)))){ delete rec[f]; ch = true } });
      if (ch) st.write(k, rec) });
  }
  if (t === 'item') Object.keys(D).filter(k => D[k].t === 'inst').forEach(k => { const rec = {...D[k]}; let ch = false;
    Object.keys(rec).filter(f => f.startsWith('o.' + id + '.')).forEach(f => { delete rec[f]; ch = true }); if (ch) st.write(k, rec) });
  st.del(id);
  // referencias genéricas según el esquema (sirve también para entidades nuevas)
  Object.keys(D).forEach(k => { const r2 = D[k], sc = SCHEMA[r2.t]; if (!sc) return; let rec = null;
    sc.cols.forEach(c => { if (c.ref !== t || !r2[c.f]) return; const v = String(r2[c.f]);
      if (c.type === 'multi'){ const l = v.split(',').filter(x => x && x !== id).join(','); if (l !== v){ rec = rec || {...r2}; if (l) rec[c.f] = l; else delete rec[c.f] } }
      else if (v === id){ rec = rec || {...r2}; delete rec[c.f] } });
    if (rec) st.write(k, rec) });
}

/* ---------- Textos: métricas, ayudas de escritura y diferencias ---------- */
const TXT_MAX = 49000;   // una celda de Google Sheets admite hasta 50.000 caracteres
const METRICS = {
  words:    {label:'Palabras', unit:'palabras', dir:'min', w:'1'},
  chars:    {label:'Caracteres con espacios', unit:'caracteres', dir:'min'},
  charsns:  {label:'Caracteres sin espacios', unit:'caracteres', dir:'min'},
  sentences:{label:'Oraciones', unit:'oraciones', dir:'min'},
  paras:    {label:'Párrafos', unit:'párrafos', dir:'min'},
  wps:      {label:'Palabras por oración (promedio)', unit:'pal./oración', dir:'min', w:'1'},
  inflesz:  {label:'Legibilidad (INFLESZ)', unit:'puntos', dir:'max', w:'2'},
  longsent: {label:'Oraciones largas (más de 30 palabras)', unit:'oraciones', dir:'min', w:'1'},
  repeats:  {label:'Repeticiones cercanas', unit:'repeticiones', dir:'min', w:'1'},
  fillers:  {label:'Muletillas', unit:'apariciones', dir:'min', w:'1'},
  variety:  {label:'Variedad de vocabulario', unit:'% palabras distintas', dir:'max', w:'1'}
};
const DEFAULT_METRICS = ['words', 'wps', 'inflesz', 'longsent', 'repeats', 'fillers', 'variety'];
const FILLERS = ['básicamente', 'realmente', 'simplemente', 'obviamente', 'literalmente', 'digamos', 'o sea', 'en este sentido', 'de alguna manera', 'de alguna forma',
  'a nivel de', 'en lo que respecta a', 'cabe destacar', 'cabe mencionar', 'es importante destacar', 'es importante mencionar', 'por así decirlo', 'a la hora de',
  'en el día de hoy', 'hoy en día', 'sin lugar a dudas', 'en definitiva', 'de hecho', 'en realidad', 'por lo tanto'];
const STOP = new Set('para porque cuando donde desde hasta entre sobre según durante mediante también además aunque mientras entonces siempre nunca había habían estaba estaban este esta estos estas ese esa esos esas aquel aquella como pero muy más menos todo toda todos todas otro otra otros otras cada mismo misma ellos ellas nosotros usted ustedes puede pueden tiene tienen hacer hace sido será serán fueron porque'.split(' '));
const WORD_RE = /[\p{L}\p{N}]+(?:[-'’][\p{L}\p{N}]+)*/gu;
const isText = g => (S.app[g] || {}).kind === 'text';

function graphemes(t){ try{ return [...new Intl.Segmenter('es', {granularity:'grapheme'}).segment(t)].map(x => x.segment) }catch(e){ return [...t] } }
function syllables(w){
  w = w.toLowerCase().replace(/[^a-záéíóúüñ]/g, ''); if (!w) return 0;
  const strong = 'aeoáéíóú', vow = 'aeiouáéíóúü'; let n = 0, prev = null;
  for (const ch of w){
    if (!vow.includes(ch)){ prev = null; continue }
    const st = strong.includes(ch);
    if (prev === null) n++; else if (st && prev) n++;   // hiato entre vocales fuertes
    prev = st;
  }
  return Math.max(1, n);
}
function sentencesOf(t){ return t.split(/(?<=[.!?…])\s+|\n+/).map(x => x.trim()).filter(x => x.match(WORD_RE)) }
function fillerHits(t){ const low = t.toLowerCase(), out = []; FILLERS.forEach(f => { const re = new RegExp('(?<![\\p{L}])' + f.replace(/ /g, '\\s+') + '(?![\\p{L}])', 'giu'); let m; while ((m = re.exec(low))) out.push([m.index, m.index + m[0].length]) }); return out }
function repeatHits(t){
  const toks = [...t.matchAll(WORD_RE)], out = [], last = {};
  toks.forEach((m, i) => { const w = m[0].toLowerCase(); if (w.length < 5 || STOP.has(w)) return;
    if (last[w] != null && i - last[w].i <= 30){ if (!last[w].marked){ out.push([last[w].s, last[w].e]); last[w].marked = true } out.push([m.index, m.index + m[0].length]) }
    last[w] = {i, s:m.index, e:m.index + m[0].length, marked:last[w] && i - last[w].i <= 30} });
  return out;
}
const MCACHE = new Map();
function metricsOf(t){
  t = (t || '').normalize('NFC'); if (MCACHE.has(t)) return MCACHE.get(t);
  const words = t.match(WORD_RE) || [], g = graphemes(t), sents = sentencesOf(t);
  const syl = words.reduce((a, w) => a + syllables(w), 0);
  const wc = words.length, sc = sents.length || (wc ? 1 : 0);
  const m = {
    words:wc, chars:g.length, charsns:g.filter(x => !/^\s+$/.test(x)).length, sentences:sc,
    paras:t.split(/\n\s*\n/).filter(p => p.match(WORD_RE)).length,
    wps:sc ? +(wc / sc).toFixed(1) : 0,
    inflesz:wc ? +(206.835 - 62.3 * (syl / wc) - wc / sc).toFixed(1) : 0,
    longsent:sents.filter(s => (s.match(WORD_RE) || []).length > 30).length,
    repeats:repeatHits(t).length, fillers:fillerHits(t).length,
    variety:wc ? +(100 * new Set(words.map(w => w.toLowerCase())).size / wc).toFixed(1) : 0
  };
  if (MCACHE.size > 200) MCACHE.clear(); MCACHE.set(t, m); return m;
}
function inflLabel(p){ return p < 40 ? 'muy difícil' : p < 55 ? 'algo difícil' : p < 65 ? 'normal' : p < 80 ? 'bastante fácil' : 'muy fácil' }
const fmtN = n => Number(n).toLocaleString('es-AR', {maximumFractionDigits:1});
function autoVal(c, it){ if (!METRICS[c.metric] || !it) return ''; return String(metricsOf(it.txt)[c.metric]) }

/** Agrega las métricas por defecto como criterios del grupo (reutiliza los del catálogo si ya existen). */
function addTextMetrics(g){
  const have = new Set(crits(g).map(c => c.metric).filter(Boolean));
  DEFAULT_METRICS.forEach(mk => {
    if (have.has(mk)) return; const M = METRICS[mk];
    let r = roots().find(x => x.kind === 'auto' && x.metric === mk);
    let rid = r && r.id; if (!rid){ rid = uid('r'); setRec(rid, {t:'root', kind:'auto', metric:mk, name:uniqueRootName(M.label), dir:M.dir}) }
    setRec(uid('c'), {t:'crit', g, root:rid, w:M.w || '1', ord:String(nextOrd(S.app, g, ''))});
  });
}

/* resaltado de ayudas de escritura */
function aidMarks(t, aids){
  const marks = [];
  if (aids.long){ let pos = 0; sentencesOf(t).forEach(s => { const i = t.indexOf(s, pos); if (i < 0) return; pos = i + s.length; if ((s.match(WORD_RE) || []).length > 30) marks.push([i, i + s.length, 'a-long']) }) }
  if (aids.rep) repeatHits(t).forEach(([a, b]) => marks.push([a, b, 'a-rep']));
  if (aids.fill) fillerHits(t).forEach(([a, b]) => marks.push([a, b, 'a-fill']));
  return marks;
}
function renderMarked(t, marks){
  if (!marks.length) return esc(t);
  const pts = new Set([0, t.length]); marks.forEach(([a, b]) => { pts.add(a); pts.add(b) });
  const cuts = [...pts].sort((x, y) => x - y); let h = '';
  for (let i = 0; i < cuts.length - 1; i++){
    const a = cuts[i], b = cuts[i + 1], cls = marks.filter(m => m[0] <= a && m[1] >= b).map(m => m[2]);
    h += cls.length ? `<mark class="${[...new Set(cls)].join(' ')}">${esc(t.slice(a, b))}</mark>` : esc(t.slice(a, b));
  }
  return h;
}

/* diferencias: LCS sobre palabras u oraciones */
function tokensOf(t, gran){
  if (gran === 'sent'){ const out = []; const re = /[^.!?…\n]+[.!?…]*\s*|\n+/g; let m; while ((m = re.exec(t))) out.push(m[0]); return out }
  return t.match(/\s+|[\p{L}\p{N}]+(?:[-'’][\p{L}\p{N}]+)*|[^\s\p{L}\p{N}]/gu) || [];
}
const keyOf = (tok, gran) => gran === 'sent' ? tok.trim().replace(/\s+/g, ' ') : (/^\s+$/.test(tok) ? ' ' : tok);
function diffTexts(A, B, gran){
  let a = tokensOf(A, gran), b = tokensOf(B, gran);
  const ka = a.map(x => keyOf(x, gran)), kb = b.map(x => keyOf(x, gran));
  let pre = 0; while (pre < ka.length && pre < kb.length && ka[pre] === kb[pre]) pre++;
  let suf = 0; while (suf < ka.length - pre && suf < kb.length - pre && ka[ka.length - 1 - suf] === kb[kb.length - 1 - suf]) suf++;
  const ops = []; const push = (t, s) => { const l = ops[ops.length - 1]; if (l && l.t === t) l.s += s; else ops.push({t, s}) };
  for (let i = 0; i < pre; i++) push('eq', b[i]);
  const ma = ka.slice(pre, ka.length - suf), mb = kb.slice(pre, kb.length - suf), ta = a.slice(pre, a.length - suf), tb = b.slice(pre, b.length - suf);
  const n = ma.length, m = mb.length;
  if (n * m > 6e6) return null;   // demasiado grande para comparar por palabra
  const L = new Uint32Array((n + 1) * (m + 1)), W = m + 1;
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--) L[i * W + j] = ma[i] === mb[j] ? L[(i + 1) * W + j + 1] + 1 : Math.max(L[(i + 1) * W + j], L[i * W + j + 1]);
  let i = 0, j = 0;
  while (i < n && j < m){
    if (ma[i] === mb[j]){ push('eq', tb[j]); i++; j++ }
    else if (L[(i + 1) * W + j] >= L[i * W + j + 1]) push('del', ta[i++]); else push('ins', tb[j++]);
  }
  while (i < n) push('del', ta[i++]); while (j < m) push('ins', tb[j++]);
  for (let k = b.length - suf; k < b.length; k++) push('eq', b[k]);
  return ops;
}
const wcount = s => (s.match(WORD_RE) || []).length;

function viewDiff(its){
  const d = S.ui.diff || {}, ids = its.map(x => x.id);
  const a = ids.includes(d.a) ? d.a : ids[0], b = ids.includes(d.b) && d.b !== a ? d.b : ids.find(x => x !== a);
  const mode = d.mode || 'side', gran = d.gran || 'word';
  if (!b) return '<p class="hint">Agregá al menos dos textos a la instancia para ver diferencias.</p>';
  const A = S.app[a].txt || '', B = S.app[b].txt || '';
  let ops = diffTexts(A, B, gran), auto = false;
  if (!ops){ ops = diffTexts(A, B, 'sent'); auto = true }
  const del = ops.filter(o => o.t === 'del').reduce((s, o) => s + wcount(o.s), 0), ins = ops.filter(o => o.t === 'ins').reduce((s, o) => s + wcount(o.s), 0);
  const eq = ops.filter(o => o.t === 'eq').reduce((s, o) => s + wcount(o.s), 0), wa = wcount(A), wb = wcount(B);
  const sim = wa + wb ? Math.round(200 * eq / (wa + wb)) : 100, dl = wb - wa;
  const sel = (id, v) => `<select id="${id}">${its.map(it => `<option value="${it.id}" ${it.id === v ? 'selected' : ''}>${esc(it.name)}</option>`).join('')}</select>`;
  const sp = s => esc(s);
  const left = ops.filter(o => o.t !== 'ins').map(o => o.t === 'del' ? `<del>${sp(o.s)}</del>` : sp(o.s)).join('');
  const right = ops.filter(o => o.t !== 'del').map(o => o.t === 'ins' ? `<ins>${sp(o.s)}</ins>` : sp(o.s)).join('');
  const uni = ops.map(o => o.t === 'del' ? `<del>${sp(o.s)}</del>` : o.t === 'ins' ? `<ins>${sp(o.s)}</ins>` : sp(o.s)).join('');
  return `<div class="dctl">
      <label class="fld" for="f_da"><span>Referencia</span>${sel('f_da', a)}</label>
      <button class="btn sm ghost" data-act="diffSwap" aria-label="Intercambiar textos">⇄</button>
      <label class="fld" for="f_db"><span>Comparar con</span>${sel('f_db', b)}</label>
      <div class="segt sm">${[['side', 'Lado a lado'], ['uni', 'Unificado']].map(([k, l]) => `<button class="${mode === k ? 'on' : ''}" data-act="diffOpt" data-o="mode" data-v="${k}">${l}</button>`).join('')}</div>
      <div class="segt sm">${[['word', 'Por palabra'], ['sent', 'Por oración']].map(([k, l]) => `<button class="${gran === k ? 'on' : ''}" data-act="diffOpt" data-o="gran" data-v="${k}">${l}</button>`).join('')}</div></div>
    <div class="dsum"><span><strong>${sim}%</strong> similitud</span><span class="dl">−${fmtN(del)} palabras quitadas</span><span class="di">+${fmtN(ins)} palabras agregadas</span>
      <span>Longitud: ${dl === 0 ? 'igual' : (dl < 0 ? '' : '+') + fmtN(dl) + ' palabras (' + (wa ? (dl < 0 ? '' : '+') + Math.round(100 * dl / wa) + '%' : '—') + ')'}</span></div>
    ${auto ? '<p class="hint">Los textos son muy largos para comparar palabra por palabra: se muestran las diferencias por oración.</p>' : ''}
    ${mode === 'side' ? `<div class="dcols"><div class="dpane"><h3>${esc(S.app[a].name)}</h3><div class="tbody">${left}</div></div><div class="dpane"><h3>${esc(S.app[b].name)}</h3><div class="tbody">${right}</div></div></div>`
      : `<div class="dpane"><div class="tbody">${uni}</div></div>`}
    <p class="hint">Si un párrafo cambió de lugar, se ve como quitado en un lado y agregado en el otro.</p>`;
}

/* ---------- Réplicas, exportación e importación ---------- */
function uniqueGroupName(n){ let x = n, i = 2; while (groups().some(g => (g.name || '').toLowerCase() === x.toLowerCase())) x = n + ' ' + (i++); return x }
const stripU = r => { const o = {...r}; delete o.u; return o };
/** Paquete autocontenido de un grupo (todas sus instancias) o de algunas instancias. */
function makeBundle(gid, only){
  const D = S.app, g = D[gid], ins = insts(gid).filter(n => !only || only.includes(n.id));
  const itemIds = only ? [...new Set(ins.flatMap(n => instIds(n)))] : items(gid).map(i => i.id);
  const uses = recs('crit').filter(u => u.g === gid);
  const setIds = only ? [...new Set(ins.map(n => n.set).filter(x => x && D[x]))] : setsOf(gid).map(s => s.id);
  const adjs = recs('adj').filter(a => setIds.includes(a.set));
  const rootIds = [...new Set([...uses.map(u => u.root), ...adjs.map(a => a.alt).filter(Boolean)])].filter(id => D[id]);
  return {format:'compareit', v:1, app:APP_NAME + ' ' + APP_BUILD, at:now(), scope:only ? 'inst' : 'group',
    group:stripU({...g, id:gid}), roots:rootIds.map(id => stripU({...D[id], id})), uses:uses.map(stripU),
    items:itemIds.filter(id => D[id]).map(id => stripU({...D[id], id})), sets:setIds.map(id => stripU({...D[id], id})), adjs:adjs.map(stripU),
    insts:ins.map(n => { const o = stripU(n); const ex = (S.ui.excl || {})[n.id]; if (ex && ex.length) o.excl = ex; return o })};
}
/** Crea una copia nueva e independiente a partir de un paquete. rootMode: keep | reuse | new */
function cloneBundle(B, opt){
  const map = {}, rootMap = {};
  B.roots.forEach(r => {
    if (opt.rootMode === 'keep' && S.app[r.id] && S.app[r.id].t === 'root'){ rootMap[r.id] = r.id; return }
    const same = roots().find(x => (x.name || '').toLowerCase() === (r.name || '').toLowerCase());
    if (opt.rootMode === 'reuse' && same){ rootMap[r.id] = same.id; return }
    const id = uid('r'), rec = {...r}; delete rec.id; rec.t = 'root'; rec.name = uniqueRootName(r.name || 'Criterio'); setRec(id, rec); rootMap[r.id] = id;
  });
  const gid = uid('g'), grec = {...B.group}; delete grec.id; delete grec.arch; grec.t = 'group'; grec.name = opt.name; setRec(gid, grec);
  B.uses.forEach(u => map[u.id] = uid('c')); B.items.forEach(i => map[i.id] = uid('i')); B.sets.forEach(s => map[s.id] = uid('s'));
  B.uses.forEach(u => { const r = {...u}; delete r.id; r.t = 'crit'; r.g = gid; r.root = rootMap[u.root] || u.root; if (r.p && map[r.p]) r.p = map[r.p]; else delete r.p; setRec(map[u.id], r) });
  B.items.forEach(i => { const r = {}; Object.entries(i).forEach(([k, v]) => { if (k === 'id') return; if (k.startsWith('v.')){ const c = map[k.slice(2)]; if (c) r['v.' + c] = v } else r[k] = v }); r.t = 'item'; r.g = gid; setRec(map[i.id], r) });
  B.sets.forEach(s => { const r = {...s}; delete r.id; r.t = 'set'; r.g = gid; setRec(map[s.id], r) });
  B.adjs.forEach(a => { if (!map[a.set] || !map[a.use]) return; const r = {...a}; delete r.id; r.t = 'adj'; r.g = gid; r.set = map[a.set]; r.use = map[a.use]; if (r.alt) r.alt = rootMap[r.alt] || r.alt; setRec(uid('a'), r) });
  const made = [];
  B.insts.forEach(n => {
    const id = uid('n'), r = {};
    Object.entries(n).forEach(([k, v]) => { if (k === 'id' || k === 'excl') return;
      if (k.startsWith('o.')){ const [, it, c] = k.split('.'); if (map[it] && map[c]) r['o.' + map[it] + '.' + map[c]] = v } else r[k] = v });
    r.t = 'inst'; r.g = gid; r.items = (n.items || '').split(',').map(x => map[x]).filter(Boolean).join(',');
    if (r.set && map[r.set]) r.set = map[r.set]; else delete r.set;
    setRec(id, r); made.push(id);
    if (n.excl && n.excl.length){ S.ui.excl = S.ui.excl || {}; S.ui.excl[id] = n.excl.map(c => map[c]).filter(Boolean) }
  });
  return {gid, insts:made};
}
function checkBundle(B){
  if (!B || B.format !== 'compareit') return 'No es un archivo de CompareIt.';
  if (B.v !== 1) return 'El archivo es de una versión de CompareIt que esta app no reconoce.';
  if (!B.group || !Array.isArray(B.uses) || !Array.isArray(B.items) || !Array.isArray(B.insts) || !Array.isArray(B.roots)) return 'El archivo está incompleto o dañado.';
  B.sets = B.sets || []; B.adjs = B.adjs || []; return null;
}

/* ---------- Criterios Raíz: utilidades ---------- */
function uniqueRootName(n, D = S.app, except){ let x = n, i = 2; while (roots(D).some(r => r.id !== except && (r.name || '').toLowerCase() === x.toLowerCase())) x = n + ' ' + (i++); return x }
function rootTaken(n, D = S.app, except){ return roots(D).some(r => r.id !== except && (r.name || '').toLowerCase() === n.toLowerCase()) }
function rootCopy(r){ const o = {t:'root'}; ROOTF.forEach(f => { if (r[f]) o[f] = r[f] }); return o }
function scUsedRoot(D, rid){ const u = {}; usesOf(rid, D).forEach(x => items(x.g, D).forEach(it => { const v = it['v.' + x.id]; if (v) u[v] = (u[v] || 0) + 1 })); return u }
function scaleCopyList(D, except){ return roots(D).filter(r => r.id !== except && r.kind === 'qual' && levelsOf(r).length > 1).map(r => [r.id, r.name, r.scale, r.off || '']) }
function kindOpts(k){ return [['num', 'Cuantitativo'], ['qual', 'Cualitativo (escala)'], ['agg', 'Agrupador'], ['auto', 'Calculado del texto']].map(([v, l]) => `<option value="${v}" ${k === v ? 'selected' : ''}>${l}</option>`).join('') }
function toggleKind(k){ document.querySelectorAll('.onlynum').forEach(x => x.hidden = k !== 'num'); document.querySelectorAll('.onlydir').forEach(x => x.hidden = k !== 'num' && k !== 'auto'); document.querySelectorAll('.onlyauto').forEach(x => x.hidden = k !== 'auto'); document.querySelectorAll('.onlyqual').forEach(x => x.hidden = k !== 'qual') }

      <label class="fld onlynum" for="f_unit" ${k !== 'num' ? 'hidden' : ''}><span>Unidad</span><input id="f_unit" value="${esc(root.unit)}" placeholder="kg, h, ARS…"></label>
    </div>
    <div class="onlyqual" ${k !== 'qual' ? 'hidden' : ''}>${scaleEditorHtml(root, id ? scUsedRoot(S.app, use.root) : {}, scaleCopyList(S.app, use.root))}</div>
    <p class="hint">Un agrupador no tiene valores propios: se calcula como promedio ponderado de sus subcriterios. Un criterio calculado toma su valor del texto de cada ítem (solo en grupos de textos).</p>`, () => {
    let name = v('f_name'); if (!name){ toast('Poné un nombre al criterio.'); return false }
    const kind = v('f_kind'); let res = null;

    const rootNew = {t:'root', name, kind}; const desc = v('f_desc'); if (desc) rootNew.desc = desc;
    if (kind === 'qual'){ rootNew.scale = res.labels.join(', '); if (res.off.length) rootNew.off = res.off.join(', ') }
    if (kind === 'num' || kind === 'auto') rootNew.dir = v('f_dir');
    if (kind === 'num'){ const un = v('f_unit'); if (un) rootNew.unit = un }
    if (kind === 'auto') rootNew.metric = v('f_metric');
    const changed = !id || !same(rootCopy(root), rootNew);
    let scope = 'all';
    if (others.length && changed){ const sel = document.querySelector('input[name=f_scope]:checked'); if (!sel){ toast('Elegí si el cambio se aplica en todos los grupos o solo en este.'); return false } scope = sel.value }
    if (!id && rootTaken(name)){ toast(`Ya existe «${name}» en el catálogo: usá «+ Desde el catálogo» o elegí otro nombre.`); return false }
    if (id && scope === 'all' && rootTaken(name, S.app, use.root)){ toast(`Ya existe otro criterio llamado «${name}» en el catálogo.`); return false }
    if (!canEdit()) return;
    let rid = id ? use.root : uid('r');
    if (id && scope === 'one' && changed){
      rid = uid('r');
      if (rootTaken(name)) rootNew.name = uniqueRootName(name + ' (' + nameOf(g) + ')');
      log(`«${root.name}» se independizó en «${nameOf(g)}» como «${rootNew.name}».`);
    }
    if (changed) setRec(rid, rootNew);
    if (id && res) (scope === 'one' ? [{id, g}] : usesOf(use.root)).forEach(u => scApplyToItems(STORE.app, S.app, u.id, u.g, res));
    const p = v('f_parent'); let ord = use.ord;
    if (!id || p !== (use.p || '')) ord = String(nextOrd(S.app, g, p));
    const useNew = {t:'crit', g, root:rid, w:v('f_w') || '1', ord}; if (p) useNew.p = p;
    SE = null; put(id || uid('c'), useNew);
  });
  scRender();
}

/* ---------- Conjuntos de criterios: guardan solo las diferencias con la Base ---------- */
const setsOf = (g, src = S.app) => recs('set', src).filter(x => x.g === g).sort((a, b) => (a.name || '').localeCompare(b.name || '', 'es'));
const adjsOf = (sid, src = S.app) => recs('adj', src).filter(a => a.set === sid);
const instsUsingSet = (sid, src = S.app) => recs('inst', src).filter(n => n.set === sid);
function adjMap(sid, src){ const m = {}; if (sid) adjsOf(sid, src).forEach(a => { if (a.use) m[a.use] = a }); return m }
/** Árbol de criterios del grupo con los ajustes de un conjunto aplicados. */
function treeFor(g, sid, src = S.app){
  const base = tree(g, src); if (!sid || !src[sid]) return base;
  const m = adjMap(sid, src);
  return base.map(c => {
    const a = m[c.id]; if (!a) return c;
    const o = {...c, adj:a};
    if (a.alt && src[a.alt] && c.leaf && src[a.alt].kind !== 'agg'){ const r = src[a.alt]; ROOTF.forEach(f => { if (r[f]) o[f] = r[f]; else delete o[f] }); o.alt = a.alt }
    if (a.w) o.w = a.w;
    if (a.on === 'no') o.setOff = true;
    return o;
  });
}
function adjDiffs(c, base, src = S.app){
  const a = c.adj; if (!a) return [];
  const d = [];
  if (a.on === 'no') d.push(['dis', 'Excluido']); else if (a.on === 'si') d.push(['pin', 'Incluido fijado']);
  if (a.w) d.push(String(a.w) === String(base.w || '1') ? ['pin', 'Peso fijado'] : ['chg', `Peso ${base.w || 1} → ${a.w}`]);
  if (a.alt) d.push(a.alt === base.root ? ['pin', 'Definición fijada'] : ['chg', 'Usa «' + ((src[a.alt] || {}).name || '?') + '»']);
  return d;
}
function setAdj(sid, cid, patch){
  if (!canEdit()) return;
  const set = S.app[sid]; if (!set) return;
  const a = recs('adj').find(x => x.set === sid && x.use === cid);
  const rec = a ? {...S.app[a.id]} : {t:'adj', g:set.g, set:sid, use:cid};
  Object.entries(patch).forEach(([k, v]) => { if (v) rec[k] = String(v); else delete rec[k] });
  if (!['on', 'w', 'alt'].some(k => rec[k])){ if (a) rmRec(a.id) } else setRec(a ? a.id : uid('a'), rec);
  commit();
}
function copyAdjs(fromSid, toSid, g){ if (!fromSid) return; adjsOf(fromSid).forEach(a => { const r = {...a, set:toSid, g}; delete r.id; setRec(uid('a'), r) }) }
function setNameTaken(g, n, except){ return setsOf(g).some(x => x.id !== except && (x.name || '').toLowerCase() === n.toLowerCase()) }

function viewCrit(g){
  const sets = setsOf(g.id), sid = (S.ui.cset || {})[g.id] || '', cur = sid && S.app[sid] ? {...S.app[sid], id:sid} : null;
  const bar = `<div class="setbar"><span class="eyebrow">Configuración de criterios</span>
    <div class="instlist"><button class="ichip ${!cur ? 'on' : ''}" data-act="pickSet" data-id="">Base</button>
      ${sets.map(x => `<button class="ichip ${cur && cur.id === x.id ? 'on' : ''}" data-act="pickSet" data-id="${x.id}">${esc(x.name)}<span>${adjsOf(x.id).length}</span></button>`).join('')}
      <button class="btn sm ed" data-act="newSet">+ Conjunto</button></div></div>`;
  return bar + (cur ? viewSet(g, cur) : viewCritBase(g));
}
function viewSet(g, set){
  const list = treeFor(g.id, set.id), base = Object.fromEntries(tree(g.id).map(c => [c.id, c]));
  const used = instsUsingSet(set.id).map(n => n.name);
  const off = new Set(); list.forEach(c => { if (c.setOff || (c.p && off.has(c.p))) off.add(c.id) });
  let h = `<div class="sharewarn"><strong>Conjunto «${esc(set.name)}»${set.desc ? ' · ' + esc(set.desc) : ''}</strong>
    Lo que no cambies acá se toma de la Base, incluidos los cambios futuros. «Fijar» deja el valor actual guardado en el conjunto aunque después cambie la Base.
    <span class="muted">${used.length ? 'Lo usan: ' + esc(used.join(', ')) : 'Todavía no lo usa ninguna instancia: asignalo desde Editar instancia o desde Comparar.'}</span>
    <div class="row ed"><button class="btn sm" data-act="editSet" data-id="${set.id}">Renombrar</button><button class="btn sm" data-act="newSet" data-from="${set.id}">Replicar conjunto</button><button class="btn sm ghost" data-act="delSet" data-id="${set.id}">Borrar conjunto</button></div></div>`;
  if (!list.length) return h + empty('El grupo no tiene criterios', 'Definí los criterios en la Base y después ajustalos en el conjunto.', null, '');
  h += `<div class="clist">${list.map(c => {
    const b = base[c.id] || c, byParent = off.has(c.id) && !c.setOff, diffs = adjDiffs(c, b);
    const alts = c.leaf ? roots().filter(r => r.kind === b.kind && r.id !== b.root) : [];
    return `<div class="crow xrow ${c.depth === 0 ? 'top-level' : ''} ${off.has(c.id) ? 'xoff' : ''}" style="padding-left:${14 + c.depth * 22}px">
      <label class="crl cname"><input type="checkbox" class="sx-on" id="sx_on_${c.id}" data-set="${set.id}" data-c="${c.id}" ${off.has(c.id) ? '' : 'checked'} ${byParent || !canEdit() ? 'disabled' : ''} aria-label="Incluir ${esc(c.name)} en el conjunto">
        <span><strong>${esc(c.name)}</strong><span class="cw">${byParent ? 'excluido junto con su agrupador' : c.leaf ? esc(critHint(c)) : 'Agrupa ' + c.kids.length + ' subcriterios'}</span></span></label>
      ${diffs.map(([k, t]) => `<span class="badge d-${k}">${esc(t)}</span>`).join('')}
      <div class="acts xacts ed">
        <label class="xw" for="sx_w_${c.id}">Peso <input id="sx_w_${c.id}" class="sx-w" data-set="${set.id}" data-c="${c.id}" data-base="${esc(b.w || '1')}" inputmode="decimal" value="${esc(c.w || '1')}"></label>
        ${c.leaf ? `<label class="xalt" for="sx_alt_${c.id}"><span class="sr">Definición</span><select id="sx_alt_${c.id}" class="sx-alt" data-set="${set.id}" data-c="${c.id}">
          <option value="" ${!c.alt ? 'selected' : ''}>Según la Base: ${esc(b.name)}</option>
          ${c.adj && c.adj.alt === b.root ? `<option value="${b.root}" selected>${esc(b.name)} (fijada)</option>` : ''}
          ${alts.map(r => `<option value="${r.id}" ${c.alt === r.id && r.id !== b.root ? 'selected' : ''}>Usar «${esc(r.name)}»</option>`).join('')}</select></label>` : ''}
        <button class="btn sm" data-act="setPin" data-set="${set.id}" data-c="${c.id}" title="Guardar los valores actuales en el conjunto">Fijar</button>
        ${c.adj ? `<button class="btn sm ghost" data-act="setReset" data-set="${set.id}" data-c="${c.id}" title="Quitar los ajustes y seguir a la Base">↺ Base</button>` : ''}
      </div></div>` }).join('')}</div>
    <p class="hint">La estructura (de qué criterio depende cada uno y el orden) se define en la Base. Para usar otra escala o sentido, elegí una réplica del criterio en «Definición»: los valores cargados en los ítems son los mismos.</p>`;
  return h;
}

function saveItemOrder(ids){

  const rest = instIds(n).filter(x => !ids.includes(x)); const val = [...ids, ...rest].join(',');

}
let colDrag = null;
document.addEventListener('pointerdown', e => {
  const h = e.target.closest && e.target.closest('.ithandle'); if (!h || e.button > 0) return;
  e.preventDefault(); const th = h.closest('th'); th.classList.add('coldrag');
  colDrag = {id:h.dataset.it, pid:e.pointerId, th, box:th.closest('.scroll'), target:null, after:false};
});
document.addEventListener('pointermove', e => {
  const d = colDrag; if (!d || e.pointerId !== d.pid) return; e.preventDefault();
  const r = d.box.getBoundingClientRect();
  if (e.clientX > r.right - 40) d.box.scrollLeft += 14; else if (e.clientX < r.left + 140) d.box.scrollLeft -= 14;   // desplaza la tabla al acercarse al borde
  const el = document.elementFromPoint(e.clientX, Math.min(Math.max(e.clientY, r.top + 4), r.bottom - 4)), th = el && el.closest('th[data-it]');
  document.querySelectorAll('th.drop-b, th.drop-a').forEach(x => x.classList.remove('drop-b', 'drop-a'));
  if (!th || th === d.th){ d.target = null; return }
  const b = th.getBoundingClientRect(); d.after = e.clientX > b.left + b.width / 2; d.target = th.dataset.it;
  th.classList.add(d.after ? 'drop-a' : 'drop-b');
}, {passive:false});
function endColDrag(e){
  const d = colDrag; if (!d || e.pointerId !== d.pid) return; colDrag = null;
  d.th.classList.remove('coldrag'); document.querySelectorAll('th.drop-b, th.drop-a').forEach(x => x.classList.remove('drop-b', 'drop-a'));
  if (!d.target) return;
  const ids = [...document.querySelectorAll('.cmp th[data-it]')].map(x => x.dataset.it).filter(x => x !== d.id);
  ids.splice(ids.indexOf(d.target) + (d.after ? 1 : 0), 0, d.id); S.focusNext = 'ih_' + d.id; saveItemOrder(ids);
}
document.addEventListener('pointerup', endColDrag); document.addEventListener('pointercancel', endColDrag);
document.addEventListener('keydown', e => {
  const t = e.target; if (!e.altKey || !t.classList || !t.classList.contains('ithandle') || (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight')) return;
  e.preventDefault(); e.stopPropagation();
  const ids = [...document.querySelectorAll('.cmp th[data-it]')].map(x => x.dataset.it), i = ids.indexOf(t.dataset.it), j = i + (e.key === 'ArrowRight' ? 1 : -1);
  if (j < 0 || j >= ids.length) return; [ids[i], ids[j]] = [ids[j], ids[i]]; S.focusNext = 'ih_' + t.dataset.it; saveItemOrder(ids);
}, true);

/* ---------- Vista: barra lateral y ancho de columnas (configuración por dispositivo) ---------- */
const LAY_CODE = {side:240, collapsed:false, col:0};   // col 0 = automático (promedio de los ítems)
const laySaved = () => LS.get('ci_lay_saved', null), layDef = () => LS.get('ci_lay_def', null);
const layBase = () => ({...LAY_CODE, ...(layDef() || {})});
S.lay = {...layBase(), ...(laySaved() || {})}; S.layUndo = [];
const layKey = l => JSON.stringify({side:l.side, collapsed:!!l.collapsed, col:l.col || 0});
const desk = () => innerWidth > 860;
function applySide(){
  document.documentElement.style.setProperty('--side-w', S.lay.side + 'px');
  document.body.classList.toggle('side-off', !!S.lay.collapsed);
}
function layChange(patch){
  const prev = {...S.lay}, next = {...S.lay, ...patch};
  if (layKey(prev) === layKey(next)) return;
  S.layUndo.push(prev); if (S.layUndo.length > 40) S.layUndo.shift();
  S.lay = next; applySide(); render();
}
/* columnas de ítems: todas del mismo ancho; en computadora siempre entran al menos 4 sin desplazarse */
function colBounds(box, sw){
  const avail = Math.max(0, box.clientWidth - sw - 2);
  const min = desk() ? 120 : 104;
  const max = desk() ? Math.floor(avail / 4) : avail;
  return {min, max:Math.max(min, max)};
}
function applyColW(t, sw, n, w){
  let cg = t.querySelector('colgroup'); if (!cg){ cg = document.createElement('colgroup'); t.prepend(cg) }
  cg.innerHTML = `<col style="width:${sw}px">` + `<col style="width:${w}px">`.repeat(n);
  t.classList.add('fixed'); t.style.width = (sw + n * w) + 'px';
  const lbl = document.getElementById('lay_colw'); if (lbl) lbl.textContent = (S.lay.col ? '' : 'automático · ') + w + ' px';
}
function sizeCols(){
  const t = document.querySelector('table.cmp'); if (!t) return;
  const box = t.closest('.scroll'), ths = [...t.querySelectorAll('thead th[data-it]')]; if (!box || !ths.length) return;
  t.classList.remove('fixed'); const cg = t.querySelector('colgroup'); if (cg) cg.remove(); t.style.width = '';
  const st = t.querySelector('thead th.sticky');
  const sw = Math.min(Math.max(st.offsetWidth, desk() ? 170 : 118), desk() ? 240 : 132);
  const b = colBounds(box, sw);
  let w = S.lay.col || Math.round(ths.reduce((a, th) => a + th.offsetWidth, 0) / ths.length);
  w = Math.min(Math.max(w, b.min), b.max);
  S.colG = {t, sw, n:ths.length, w, b}; applyColW(t, sw, ths.length, w);
}
function layBar(){
  const dirty = layKey(S.lay) !== layKey({...layBase(), ...(laySaved() || {})});
  return `<div class="laybar"><span class="muted">Columnas: <span id="lay_colw" class="val">${S.lay.col ? S.lay.col + ' px' : 'automático'}</span>${dirty ? ' · <em>cambios sin guardar</em>' : ''}</span>
    <div class="row"><button class="btn sm" data-act="layUndo" ${S.layUndo.length ? '' : 'disabled'} title="Deshacer el último cambio de vista">↶ Deshacer</button>
      <button class="btn sm" data-act="laySave" title="Guardar esta configuración en este dispositivo">Guardar configuración</button>
      <button class="btn sm ghost" data-act="layDefault" title="Volver a la configuración default">Restablecer default</button>
      <details class="more"><summary class="btn sm ghost">Más</summary><div class="more-m">
        <button data-act="laySetDefault">Establecer la actual como nueva default</button>
        <button data-act="layReset" class="danger-t">Reset total (configuración de fábrica)</button></div></details></div></div>`;
}
/* arrastre de la barra lateral y de los bordes de columna */
let rz = null;
document.addEventListener('pointerdown', e => {
  const h = e.target.closest && e.target.closest('[data-rz]'); if (!h || e.button > 0) return;
  e.preventDefault(); e.stopPropagation();
  rz = {type:h.dataset.rz, x:e.clientX, pid:e.pointerId, start:h.dataset.rz === 'side' ? S.lay.side : (S.colG ? S.colG.w : 160), val:null};
  document.body.classList.add('resizing');
}, true);
document.addEventListener('pointermove', e => {
  if (!rz || e.pointerId !== rz.pid) return; e.preventDefault();
  const dx = e.clientX - rz.x;
  if (rz.type === 'side'){ rz.val = Math.min(420, Math.max(180, Math.round(rz.start + dx))); document.documentElement.style.setProperty('--side-w', rz.val + 'px') }
  else if (S.colG){ const g = S.colG; rz.val = Math.min(g.b.max, Math.max(g.b.min, Math.round(rz.start + dx))); applyColW(g.t, g.sw, g.n, rz.val) }
}, {passive:false});
function endRz(e){
  if (!rz || e.pointerId !== rz.pid) return; const r = rz; rz = null; document.body.classList.remove('resizing');
  if (r.val == null || r.val === r.start) return;
  if (r.type === 'side') layChange({side:r.val}); else layChange({col:r.val});
}
document.addEventListener('pointerup', endRz); document.addEventListener('pointercancel', endRz);
let rsT = null; addEventListener('resize', () => { clearTimeout(rsT); rsT = setTimeout(sizeCols, 120) });
const LAY_ACT = {
  sideCollapse(){ layChange({collapsed:true}) },
  sideExpand(){ layChange({collapsed:false}) },
  layUndo(){ const p = S.layUndo.pop(); if (!p) return; S.lay = p; applySide(); render(); toast('Se deshizo el último cambio de vista.') },
  laySave(){ LS.set('ci_lay_saved', S.lay); render(); toast('Configuración guardada en este dispositivo.') },
  layDefault(){ layChange({...layBase()}); toast('Se restableció la configuración default.') },
  laySetDefault(){ modal('Nueva configuración default', '<p>La configuración actual (barra lateral y ancho de columnas) pasa a ser la default de este dispositivo. «Restablecer default» va a volver a ella.</p><p class="hint">La default anterior se reemplaza y no se puede recuperar con Deshacer.</p>', () => {
    LS.set('ci_lay_def', S.lay); LS.set('ci_lay_saved', S.lay); render(); toast('Nueva configuración default establecida.') }, 'Establecer') },
  layReset(){ modal('Reset total de la vista', '<p>Se borran la configuración guardada y la default personalizada de este dispositivo, y la vista vuelve a la configuración de fábrica de la app.</p><p class="hint">Tus datos no se tocan. Esta acción no se puede deshacer.</p>', () => {
    try{ localStorage.removeItem('ci_lay_saved'); localStorage.removeItem('ci_lay_def') }catch(e){}
    S.layUndo = []; S.lay = {...LAY_CODE}; applySide(); render(); toast('Vista restablecida a la configuración de fábrica.') }, 'Reset total', true) }
};

/* ---------- grupos ocultos (por dispositivo) y archivados (sincronizado) ---------- */
const EYE = '<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="3" fill="currentColor"/></svg>';
const EYE_OFF = '<svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M2 12s3.6-7 10-7c2 0 3.7.7 5.1 1.6M22 12s-3.6 7-10 7c-2 0-3.7-.7-5.1-1.6" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M3 3l18 18" stroke="currentColor" stroke-width="1.8"/></svg>';
function hiddenBody(){
  const list = groups().filter(g => isHidden(g.id) || S.hidSess.has(g.id));
  if (!list.length) return '<p class="hint">No hay grupos ocultos en este dispositivo.</p>';
  return `<p class="hint">Los grupos ocultos no se ven en la lista, solo en este dispositivo. Tocá el ojo para mostrarlos u ocultarlos: el cambio se ve al instante.</p>
    <div class="hlist">${list.map(g => { const h = isHidden(g.id);
      return `<div class="hrow ${h ? 'ishid' : ''}"><button type="button" class="eyeb" data-act="toggleHide" data-id="${g.id}" aria-pressed="${!h}" aria-label="${h ? 'Mostrar' : 'Ocultar'} ${esc(g.name)}" title="${h ? 'Mostrar' : 'Ocultar'}">${h ? EYE_OFF : EYE}</button>

}
function openHidden(){ S.hidSess = new Set(); modal('Ocultos (' + hiddenGroups().length + ')', hiddenBody(), null) }
function setHidden(id, h){ if (h) S.hidden.add(id); else S.hidden.delete(id); saveHidden() }

/* ---------- instancias: navegación y orden ---------- */
function goInst(id){
  const list = insts(S.ui.g), cur = curInst(); if (!cur || cur.id === id) return;
  const a = list.findIndex(n => n.id === cur.id), b = list.findIndex(n => n.id === id);
  S.slide = b > a ? 'slide-l' : 'slide-r'; S.ui.inst[S.ui.g] = id; save(); render();
}
function stepInst(d){ const list = insts(S.ui.g), cur = curInst(); if (!cur) return; const n = list[list.findIndex(x => x.id === cur.id) + d]; if (n) goInst(n.id) }
function saveInstOrder(ids){
  if (!canEdit()) return; let ch = false;
  ids.forEach((id, k) => { if (S.app[id] && String(S.app[id].ord || '') !== String(k + 1)){ setRec(id, {...S.app[id], ord:String(k + 1)}); ch = true } });
  if (ch) commit(); else render();
}
let chipDrag = null, chipDragged = false;
document.addEventListener('pointerdown', e => {
  const chip = e.target.closest && e.target.closest('.can-drag .ichip'); if (!chip || e.button > 0) return;
  chipDrag = {chip, list:chip.parentNode, x:e.clientX, y:e.clientY, pid:e.pointerId, on:false};
});
document.addEventListener('pointermove', e => {
  const d = chipDrag; if (!d || e.pointerId !== d.pid) return;
  if (!d.on){ if (Math.hypot(e.clientX - d.x, e.clientY - d.y) < 8) return; d.on = true; d.chip.classList.add('dragging') }
  e.preventDefault();
  const over = document.elementFromPoint(e.clientX, e.clientY), t = over && over.closest('.ichip');
  if (!t || t === d.chip || t.parentNode !== d.list) return;
  const r = t.getBoundingClientRect();
  d.list.insertBefore(d.chip, e.clientX < r.left + r.width / 2 ? t : t.nextSibling);
}, {passive:false});
function endChipDrag(e){
  const d = chipDrag; if (!d || e.pointerId !== d.pid) return; chipDrag = null;
  if (!d.on) return;
  chipDragged = true; d.chip.classList.remove('dragging');
  saveInstOrder([...d.list.querySelectorAll('.ichip')].map(c => c.dataset.id));
}
document.addEventListener('pointerup', endChipDrag); document.addEventListener('pointercancel', endChipDrag);
document.addEventListener('click', e => { if (chipDragged){ chipDragged = false; e.stopPropagation(); e.preventDefault() } }, true);
document.addEventListener('keydown', e => {
  if (S.ui.view !== 'group' || S.ui.tab !== 'cmp' || !$('#modal').hidden || S.drawer || e.ctrlKey || e.metaKey) return;
  if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
  const t = e.target, d = e.key === 'ArrowRight' ? 1 : -1;
  if (t.classList && t.classList.contains('ithandle')) return;
  if (e.altKey && t.classList && t.classList.contains('ichip')){   // Alt + flechas: mover la instancia enfocada
    e.preventDefault(); const ids = insts(S.ui.g).map(n => n.id), i = ids.indexOf(t.dataset.id), j = i + d;
    if (j < 0 || j >= ids.length) return; [ids[i], ids[j]] = [ids[j], ids[i]]; S.focusNext = 'ich_' + t.dataset.id; saveInstOrder(ids); return;
  }
  if (e.altKey || e.shiftKey || (t.closest && t.closest('input,select,textarea,[contenteditable]'))) return;
  e.preventDefault(); stepInst(d);
});
