  inclAll(){ const n = curInst(); if (n && S.ui.excl) delete S.ui.excl[n.id]; save(); render() },
  openPlan(){ S.ui.view = 'plan'; save(); render() },
  planTab(el){ S.ui[el.dataset.sk === 'app' ? 'planTab' : 'sheetTab'] = el.dataset.k; save(); render() },
  planAdd(){ const el = document.querySelector('.newrow .pc'); if (el){ el.focus(); el.scrollIntoView({block:'nearest'}) } },
  planDel(el){ const sk = el.dataset.sk, t = el.dataset.t, id = el.dataset.id, D = STORE[sk].get();
    confirmDel(delText(D, t, id), () => { if (sk === 'app' && !canEdit()) return; cascadeDel(sk, t, id); if (sk === 'app') fixUi(); STORE[sk].after(); render() }) },
  pickScale(el){ const sk = el.dataset.sk, st = STORE[sk], D = st.get(), id = el.dataset.id, rec = D[id];
    if (!rec || (sk === 'app' && !canEdit())) return;
    const gs = groupsOfRoot(id, D).map(x => D[x].name);
    modal('Escala de «' + (rec.name || '') + '»', (gs.length > 1 ? `<div class="sharewarn"><strong>Criterio compartido.</strong> El cambio se aplica en todos los grupos donde se usa: ${esc(gs.join(', '))}.</div>` : '') + scaleEditorHtml(rec, scUsedRoot(D, id), scaleCopyList(D, id)), () => {
      const res = scResult(); if (typeof res === 'string'){ toast(res); return false }
      usesOf(id, D).forEach(u => scApplyToItems(st, D, u.id, u.g, res)); const r2 = {...rec, scale:res.labels.join(', ')}; if (res.off.length) r2.off = res.off.join(', '); else delete r2.off; st.write(id, r2); st.after(); SE = null; render() });
    scRender() },
  pickMulti(el){ const sk = el.dataset.sk, st = STORE[sk], D = st.get(), id = el.dataset.id, f = el.dataset.f, rec = D[id];
    if (!rec || (sk === 'app' && !canEdit())) return;
    const its = items(rec.g, D), sel = String(rec[f] || '').split(',');
    modal('Ítems de «' + (rec.name || '') + '»', its.length ? `<div class="checks">${its.map(it => `<label><input type="checkbox" id="f_pm_${it.id}" ${sel.includes(it.id) ? 'checked' : ''}> ${esc(it.name)}</label>`).join('')}</div>` : '<p class="hint">El grupo de esta instancia todavía no tiene ítems.</p>', () => {
      const ch = its.filter(it => document.getElementById('f_pm_' + it.id).checked).map(it => it.id); const r = {...rec, [f]:ch.join(',')};
      Object.keys(r).filter(k => k.startsWith('o.') && !ch.includes(k.split('.')[1])).forEach(k => delete r[k]);
      if (!r[f]) delete r[f]; st.write(id, r); st.after(); render() }) },
  goCrit(){ S.ui.tab = 'crit'; render() },
  newGroup(){ groupForm() }, editGroup(){ groupForm(S.ui.g) },
  delGroup(){ const g = S.ui.g; confirmDel(delText(S.app, 'group', g), () => { if (!canEdit()) return; cascadeDel('app', 'group', g); S.ui.g = ''; fixUi(); commit() }) },
  pickInst(el){ goInst(el.dataset.id) },
  instStep(el){ stepInst(+el.dataset.d) },
  newInst(){ instForm() }, editInst(){ instForm(curInst()?.id) },
  delInst(){ const n = curInst(); confirmDel(delText(S.app, 'inst', n.id), () => { if (!canEdit()) return; cascadeDel('app', 'inst', n.id); commit() }) },
  newItem(){ itemForm() }, editItem(el){ itemForm(el.dataset.id) },
  delItem(el){ const id = el.dataset.id; confirmDel(delText(S.app, 'item', id), () => { if (!canEdit()) return; cascadeDel('app', 'item', id); commit() }) },
  newCrit(el){ critForm(null, el.dataset.parent) }, editCrit(el){ critForm(el.dataset.id) },
  fromCatalog(){ catalogForm() }, replicate(el){ replicateForm(el.dataset.id) }, independize(el){ independizeForm(el.dataset.id) }, linkRoot(el){ linkRootForm(el.dataset.id) },
  delCrit(el){ const id = el.dataset.id; confirmDel(delText(S.app, 'crit', id), () => { if (!canEdit()) return; cascadeDel('app', 'crit', id); commit() }) },
  moveCrit(el){
    if (!canEdit()) return; const c = S.app[el.dataset.id]; const sib = crits(S.ui.g).filter(x => (x.p || '') === (c.p || '')).sort((a, b) => (+a.ord || 0) - (+b.ord || 0));
    const i = sib.findIndex(x => x.id === el.dataset.id), j = i + (+el.dataset.d); if (j < 0 || j >= sib.length) return;
    [sib[i], sib[j]] = [sib[j], sib[i]]; sib.forEach((x, k) => { if (String(k + 1) !== x.ord) setRec(x.id, {...S.app[x.id], ord:String(k + 1)}) }); commit();
  },
  cell(el, e){
    if (!canEdit()) return; const m = $('#menu'); m.dataset.it = el.dataset.it; m.dataset.c = el.dataset.c;
    const r = el.getBoundingClientRect(); m.hidden = false;
    m.style.left = Math.max(8, Math.min(r.left, innerWidth - m.offsetWidth - 8)) + 'px';
    m.style.top = (r.bottom + m.offsetHeight + 8 > innerHeight ? Math.max(8, r.top - m.offsetHeight - 4) : r.bottom + 4) + 'px';
  },
  setOv(el){
    const m = $('#menu'), n = curInst(); m.hidden = true; if (!n) return;
    const f = 'o.' + m.dataset.it + '.' + m.dataset.c; const rec = {...S.app[n.id]};
    if (el.dataset.v) rec[f] = el.dataset.v; else delete rec[f]; put(n.id, rec);
  },
  async apiConnect(el){
    const cfg = {url:v('f_apiurl'), key:v('f_apikey')}; const upload = $('#f_apiup').checked;
    if (!/^https:\/\/script\.google\.com\/.+\/exec$/.test(cfg.url)) return toast('Pegá la URL de la aplicación web: empieza con https://script.google.com/ y termina en /exec.');
    if (!cfg.key) return toast('Pegá la clave API_KEY que figura en Código.gs.');
    el.disabled = true; el.textContent = 'Probando…';
    try{
      const info = await apiCall(cfg, 'getInfo');
      if (upload){ S.base = {} } else { S.app = {}; S.base = {} }
      S.conflicts = []; S.online = true; S.mode = 'app'; S.last = ''; S.ver = '';
      log('Conectada a la planilla «' + info.name + '».'); save(); LS.set('ci_api', cfg); location.reload();
    }catch(e){ el.disabled = false; el.textContent = 'Probar y conectar'; S.err = errText(e); renderDrawer() }
  },
  apiDisconnect(){ modal('Desconectar la planilla', '<p>La app vuelve a la simulación con los datos de ejemplo. Tu Google Sheet no se modifica.</p>', () => {
    try{ localStorage.removeItem('ci_api') }catch(e){}
    S.app = clone(SIM.records); S.base = clone(SIM.records); S.conflicts = []; S.ver = ''; save(); location.reload() }, 'Desconectar') },
  resolveOne(el){ resolve([el.dataset.k]) }, resolveAll(){ resolve(S.conflicts.map(c => c.k)) },
  demoConflict(){
    const g = S.ui.g && S.app[S.ui.g] ? S.ui.g : groups()[0]?.id; const it = items(g)[0]; const c = tree(g).find(x => x.leaf && x.kind !== 'qual');
    if (!it || !c || !SIM.records[it.id]) return toast('Hace falta un ítem con un criterio numérico sincronizado.');
    const base = parseFloat(it['v.' + c.id] || '100') || 100;
    if (S.mode !== 'app'){ S.mode = 'app' }
    setRec(it.id, {...S.app[it.id], ['v.' + c.id]:String(Math.round(base * 1.1))});
    SIM.records[it.id] = {...SIM.records[it.id], ['v.' + c.id]:String(Math.round(base * 0.9)), u:new Date(Date.now() + 1000).toISOString()}; simBump('Planilla');
    log(`Ejemplo: «${it.name} / ${c.name}» se cambió a la vez en la app y en la Sheet.`);
    S.online = true; S.ui.view = 'group'; S.ui.g = g; S.ui.tab = 'cmp'; save(); sync(false);
  },
  resetDemo(){ modal('Restablecer datos de ejemplo', '<p>Se reemplazan la Sheet simulada y la copia local por los datos de ejemplo. Se pierde lo cargado en el prototipo.</p>', () => {
    SIM = {records:seed(), sd:true, rt:true}; simBump('Planilla'); S.ver = ''; S.app = clone(SIM.records); S.base = clone(SIM.records); S.conflicts = []; S.choice = {}; S.log = []; S.online = true; S.mode = 'app';
    log('Datos de ejemplo restablecidos.'); fixUi(); save(); render() }, 'Restablecer', true) }
};

Object.assign(ACT, LAY_ACT);
document.addEventListener('click', e => {
  const ai = e.target.closest && e.target.closest('[data-ai]');
  if (ai){ ai.parentNode.querySelectorAll('[data-ai]').forEach(b => b.classList.toggle('on', b === ai)); document.getElementById('f_ai_kind').value = ai.dataset.ai; aiRefresh(); return }
  const el = e.target.closest('[data-act]'); const menu = $('#menu');
  if (!menu.hidden && !e.target.closest('#menu') && el?.dataset.act !== 'cell') menu.hidden = true;
  if (e.target === $('#modal')) return closeModal();
  if (el && ACT[el.dataset.act]) ACT[el.dataset.act](el, e);
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'f_kind') toggleKind(t.value);
  else if (t.id === 'f_concl'){ const n = curInst(); if (n) put(n.id, {...S.app[n.id], concl:t.value.trim()}) }
  else if (t.id === 'f_auto'){ S.auto = t.value; save(); planPoll(true) }
  else if (t.classList.contains('pc')) planChange(t);
  else if (t.id && t.id.startsWith('f_ai_') && t.id !== 'f_ai_resp') aiRefresh();
  else if (t.name === 'f_exp_scope'){ if (EXP_UPD) EXP_UPD() }
  else if (t.id === 'f_imp_file'){ const f = t.files && t.files[0]; if (!f) return; const rd = new FileReader();
    rd.onload = () => { document.getElementById('f_imp_txt').value = rd.result; impPreview() }; rd.onerror = () => toast('No se pudo leer el archivo.'); rd.readAsText(f) }
  else if (t.id === 'f_gkind'){ document.querySelectorAll('.onlytxt').forEach(x => x.hidden = t.value !== 'text') }
  else if (t.classList.contains('aidchk')){ S.ui.aids = {...(S.ui.aids || {long:true, rep:true, fill:true}), [t.dataset.k]:t.checked}; save(); render() }
  else if (t.id === 'f_da' || t.id === 'f_db'){ S.ui.diff = {...(S.ui.diff || {}), [t.id === 'f_da' ? 'a' : 'b']:t.value}; save(); render() }
  else if (t.classList.contains('sx-on')){ const a = recs('adj').find(x => x.set === t.dataset.set && x.use === t.dataset.c); setAdj(t.dataset.set, t.dataset.c, {on:t.checked ? (a && a.on === 'si' ? 'si' : '') : 'no'}) }
  else if (t.classList.contains('sx-w')){ const val = t.value.trim().replace(',', '.'); if (val && isNaN(+val)){ toast('El peso tiene que ser un número.'); render(); return }
    const a = recs('adj').find(x => x.set === t.dataset.set && x.use === t.dataset.c), pinned = a && a.w && String(a.w) === t.dataset.base;
    setAdj(t.dataset.set, t.dataset.c, {w:!val || (val === t.dataset.base && !pinned) ? '' : val}) }
  else if (t.classList.contains('sx-alt')) setAdj(t.dataset.set, t.dataset.c, {alt:t.value})
  else if (t.id === 'f_isort'){ const n = curInst(); if (n){ S.ui.isort = {...(S.ui.isort || {}), [n.id]:t.value}; save(); render() } }
  else if (t.id === 'f_iset'){ const n = curInst(); if (n){ const r = {...S.app[n.id]}; if (t.value) r.set = t.value; else delete r.set; put(n.id, r) } }
  else if (t.classList.contains('cx')){ const n = curInst(); if (!n) return; S.ui.excl = S.ui.excl || {};
    const set = new Set(S.ui.excl[n.id] || []); if (t.checked) set.delete(t.dataset.c); else set.add(t.dataset.c);
    if (set.size) S.ui.excl[n.id] = [...set]; else delete S.ui.excl[n.id]; save(); render() }
  else if (t.id === 'f_online' || t.id === 'f_online2'){ S.online = t.checked; log(t.checked ? 'Conexión restablecida.' : 'Conexión cortada (simulación): los cambios quedan en la copia local.'); save(); if (t.checked) sync(false).then(() => planPoll(true)); else { planPoll(); render() } }
  else if (t.type === 'radio' && t.dataset.k){ (S.choice[t.dataset.k] ||= {})[t.dataset.f] = t.value }
});
document.addEventListener('keydown', e => {
  const t = e.target;
  if (e.key === 'Enter' && t.classList && t.classList.contains('pc') && t.tagName === 'INPUT'){
    e.preventDefault(); const list = [...document.querySelectorAll('.pc[data-f="' + t.dataset.f + '"]')];
    const next = list[list.indexOf(t) + 1]; if (next) next.focus(); else t.blur(); return;
  } if (e.key === 'Escape'){ if (!$('#modal').hidden) closeModal(); else if (!$('#menu').hidden) $('#menu').hidden = true; else if (S.drawer) ACT.closeSync() } });

document.addEventListener('visibilitychange', () => {
  if (document.hidden){ clearTimeout(pollT); nextAt = 0; return }
  const since = S.lastCheck ? Date.now() - new Date(S.lastCheck).getTime() : Infinity;
  if (since > 20000) sync(true).then(ch => planPoll(true)); else planPoll(false);
});
addEventListener('online', () => { log('Conexión a internet restablecida.'); sync(true).then(() => planPoll(true)) });
addEventListener('offline', () => { if (MODE === 'sim') return; clearTimeout(pollT); nextAt = 0; S.reach = false; S.err = 'Sin conexión a internet: los cambios quedan en la copia local.'; render() });
if (navigator.connection && navigator.connection.addEventListener) navigator.connection.addEventListener('change', () => planPoll(true));
function loadInfo(){ return withRetry(() => MODE === 'gas' ? gcall('getInfo') : apiCall(API, 'getInfo')).then(i => { S.sheet = i; LS.set('ci_sheet', i); render() }).catch(e => { if (!S.sheet){ S.err = errText(e); log('No se pudo leer la planilla: ' + S.err); render() } }) }
applySide(); fixUi(); render(); sync(true).then(() => { planPoll(true); if (REAL) loadInfo() });
</script>
